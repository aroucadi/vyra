name: Vyra CI

on:
  push:
    branches:
      - main
      - release/aero
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Unit Tests, Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Static Verification
        run: npx tsc --noEmit

      - name: Repository-Wide ESLint
        run: npm run lint

      - name: Comprehensive Unit Test Suite
        run: npm test

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright End-to-End Test Suite
        run: npm run test:e2e
        env:
          NODE_ENV: production
          CI: true

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
