<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet des dépenses — Villa Bouskoura</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1FA;--card:#fff;--line:rgba(11,18,48,.12);--tx:#0B1230;--mu:#4B567F;--gold:#F2B01E;--goldt:#8A5A00;--blue:#4F6BFF;--bl:#3550E6;--pat:rgba(11,18,48,.045);--glow:rgba(79,107,255,.2);--ok:#0E8F5B}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080D26;--card:#131C4A;--line:rgba(255,255,255,.11);--tx:#F4EEDF;--mu:#9CA6CE;--gold:#FFC233;--goldt:#FFC233;--bl:#8EA2FF;--pat:rgba(255,194,51,.07);--glow:rgba(79,107,255,.38);--ok:#66E0A8}}
:root[data-theme="dark"]{--bg:#080D26;--card:#131C4A;--line:rgba(255,255,255,.11);--tx:#F4EEDF;--mu:#9CA6CE;--gold:#FFC233;--goldt:#FFC233;--bl:#8EA2FF;--pat:rgba(255,194,51,.07);--glow:rgba(79,107,255,.38);--ok:#66E0A8}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--tx);font:400 15px/1.45 "Schibsted Grotesk","Trebuchet MS",sans-serif;background:radial-gradient(900px 520px at 90% -8%,var(--glow),transparent 62%),repeating-conic-gradient(from 22.5deg at 50% 50%,var(--pat) 0 11.25deg,transparent 0 22.5deg) 0 0/72px 72px,var(--bg);padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 0 8px}
h1{font:700 clamp(26px,8vw,38px)/1.02 "Reem Kufi","Trebuchet MS",sans-serif;margin:0;letter-spacing:.01em}
.sub{color:var(--mu);font-size:13px;margin-top:8px}
.tg{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);width:42px;height:42px;border-radius:50%;font-size:17px;cursor:pointer}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(var(--bg) 80%,transparent);padding:10px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:7px;align-items:center;min-height:38px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 13px;font:600 13px "Schibsted Grotesk",sans-serif;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.row2{display:flex;gap:8px;margin-top:8px}
select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;font:600 13px "Schibsted Grotesk",sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}
.k{font:600 11px "Schibsted Grotesk",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.big{font:700 clamp(42px,14vw,72px)/1 "Reem Kufi","Trebuchet MS",sans-serif;color:var(--goldt);font-variant-numeric:tabular-nums;margin:8px 0 2px}
.big small{font-size:.34em;margin-left:8px;opacity:.75}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-top:16px}
.bar>span{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.paid{background:var(--gold)}
.come{background:repeating-linear-gradient(135deg,var(--blue) 0 5px,transparent 5px 10px)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.stats b{display:block;font:700 24px "Reem Kufi","Trebuchet MS",sans-serif;font-variant-numeric:tabular-nums;margin-top:3px}
.note{color:var(--mu);font-size:12.5px;margin:10px 0 0}
.donutrow{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
@media(max-width:440px){.donutrow{grid-template-columns:1fr}.donut{margin:auto}}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}
.donut span{position:relative;z-index:1;text-align:center;font:700 11px "Schibsted Grotesk",sans-serif;color:var(--mu);letter-spacing:.1em;text-transform:uppercase}
.m{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;padding:11px 0;cursor:pointer;font:inherit}
.m:last-child{border:0}
.m .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.m .t{font-weight:600}.m .a{font-weight:800;font-variant-numeric:tabular-nums}
.mb{height:7px;border-radius:9px;background:var(--line);margin-top:9px;overflow:hidden}
.mb span{display:block;height:100%;width:0;background:var(--c);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.mb.hat{background:repeating-linear-gradient(135deg,var(--gold) 0 5px,transparent 5px 10px);opacity:.6}
.sm{font-size:12px;color:var(--mu);margin-top:5px}
.gh{display:flex;align-items:center;gap:9px;font:700 19px "Reem Kufi","Trebuchet MS",sans-serif;margin:26px 0 4px}
.gh i{width:12px;height:12px;border-radius:3px;background:var(--c);transform:rotate(45deg);flex:none}
.gh b{margin-left:auto;font:800 14px "Schibsted Grotesk",sans-serif;color:var(--mu);font-variant-numeric:tabular-nums}
.lh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.t{font-weight:600}
.badge{flex:none;font:700 11px "Schibsted Grotesk",sans-serif;padding:4px 10px;border-radius:99px}
.b-ok{background:rgba(14,143,91,.16);color:var(--ok)}
.b-cours{background:rgba(79,107,255,.18);color:var(--bl)}
.b-av{background:rgba(242,176,30,.22);color:var(--goldt)}
.nums{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13px;color:var(--mu)}
.nums b{color:var(--tx);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;margin-top:12px;font-weight:600;font-size:13px;color:var(--mu)}
.pr{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.cb{display:flex;align-items:flex-end;gap:8px;height:170px;overflow-x:auto;padding:6px 2px 0}
.cb>div{flex:none;width:38px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;font-size:10px;color:var(--mu);text-align:center;line-height:1.15}
.cb i{display:block;width:100%;height:0;border-radius:9px 9px 3px 3px;background:var(--gold);transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.ev{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev>i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.ev>div{flex:1;min-width:0}.ev b{font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:6px;padding:12px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 38%)}
.tabs button{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;padding:8px 4px;font:600 11.5px "Schibsted Grotesk",sans-serif;cursor:pointer}
.tabs b{font-size:16px;line-height:1}
.tabs button[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Villa Bouskoura</h1><div class="sub">Carnet des dépenses · arrêté au 4 novembre 2026<br>Ce qui est payé. Ce qui est acquis. Rien d’autre.</div></div>
    <button class="tg" id="tg" aria-label="Changer de thème">◐</button>
  </header>
  <div class="filters">
    <div class="chips" id="fm"></div>
    <div class="row2"><select id="fl" aria-label="Ligne"></select>
      <select id="fs" aria-label="Statut"><option value="all">Tous les statuts</option><option value="ok">Soldés</option><option value="cours">Solde à venir</option><option value="av">Avances sans total</option></select></div>
  </div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-t="bilan"><b>◐</b>Bilan</button>
  <button data-t="detail"><b>▦</b>Détail</button>
  <button data-t="chrono"><b>≋</b>Chronologie</button>
  <button data-t="venir"><b>➜</b>À venir</button>
</nav>
<script>
const $=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],nf=new Intl.NumberFormat('fr-FR'),fm=n=>nf.format(Math.round(n));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const M={fon:['Terrain & acquisition','#E4795A'],adm:['Études & administratif','#7FBF9E'],go:['Gros œuvre & structure','#5B77FF'],vrd:['Raccordements & VRD','#34C3C9'],tec:['Lots techniques','#E9C46A'],fin:['Second œuvre & finitions','#E06C9F']};
const ST={ok:'Soldé',cours:'Solde acquis à venir',av:'Avance · total non fixé'};
const MOF=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],MOC=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
// [macro, ligne, contrat, solde acquis, paiements "date:montant"]
const RAW=[
['fon','Achat terrain',1200000,0,'2024-06-29:1200000'],
['fon','Frais d’acquisition (notaire, enregistrement)',87200,0,'2024-06-07:87200'],
['adm','Cagnotte clé en main — architecte, 3D, plans béton armé',200000,0,'2024-08-31:50000|2024-09-03:50000|2024-11-25:50000|2024-11-27:50000'],
['adm','Taxe opération de construction — Commune',13860,0,'2025-08-04:13860'],
['adm','Taxe occupation du domaine public — Commune',4800,0,'2025-08-04:4800'],
['adm','Taxe terrains urbains non bâtis — Commune',4752,0,'2025-07-21:4752'],
['adm','Frais de service — Agence urbaine',1573.8,0,'2025-08-06:1573.8'],
['adm','Taxe Agence urbaine',1085,0,'2025-08-12:1085'],
['go','Terrassement',30000,0,'2025-10-22:30000'],
['go','D1 · Avance',120000,0,'2025-08-13:120000'],
['go','D2 · Réception des fondations',96000,0,'2025-11-11:96000'],
['go','D3 · Plancher haut sous-sol',84000,0,'2025-12-16:84000'],
['go','D4 · Plancher haut RDC',84000,0,'2026-01-27:84000'],
['go','D5 · Plancher haut 1er étage',84000,0,'2026-02-17:40000|2026-02-17:44000'],
['go','D6 · Cloisons sous-sol',60000,0,':20000|:20000|:20000'],
['go','D7 · Cloisons RDC',48000,0,'2026-04-28:48000'],
['go','D8 · Cloisons étage',60000,0,'2026-04-30:50000|2026-05-01:10000'],
['go','D9 · Enduit intérieur',60000,0,'2026-05-12:30000|2026-05-12:20000|2026-05-13:10000'],
['go','D10 · Enduit extérieur',60000,0,'2026-07-27:20000|2026-07-27:10000|2026-08-04:20000|2026-08-24:10000'],
['go','D11 · Piscine en béton armé',102000,0,'2026-06-29:20000|2026-07-01:12000|2026-07-08:20000|2026-07-10:50000'],
['go','D12 · Travaux extérieurs',72180,57180,'2026-10-22:15000'],
['go','Étanchéité & isolation du toit',30000,10000,'2026-09-01:20000'],
['go','Vitalbox · coffres tunnels des volets',10218,0,'2026-04-24:10218'],
['vrd','Puits & équipement (pompe)',60433,0,'2026-05-13:5000|2026-05-15:37000|2026-05-15:18433'],
['vrd','Branchement eau & portail',35077,0,'2026-04-29:35077'],
['vrd','Branchement électricité',9000,0,'2025-10-31:9000'],
['tec','Plomberie',113500,53500,'2026-03-06:20000|2026-07-11:20000|2026-09-03:20000'],
['tec','Électricité',115500,60500,'2026-03-06:20000|2026-08-01:15000|2026-10-28:20000'],
['tec','Climatisation',111990,6000,'2026-08-08:20000|2026-08-13:65990|2026-09-03:20000'],
['fin','Plâtre marocain',50000,10000,'2026-08-01:10000|2026-09-02:10000|2026-09-22:10000|2026-09-30:10000'],
['fin','Métallerie / Aluminium — périmètre mixte',null,0,'2026-03-06:35000|2026-07-11:28000|2026-08-01:60000|2026-09-01:65000|2026-11-04:50000'],
['fin','Menuiserie bois',null,0,'2026-03-06:30000|2026-11-04:30000'],
['fin','Habillage intérieur — marbre (avance)',null,0,'2026-10-06:40000']];
const L=RAW.map((r,i)=>{const p=r[4].split('|').map(s=>{const q=s.split(':');return{d:q[0],a:+q[1]}});const paid=p.reduce((s,x)=>s+x.a,0);return{i,m:r[0],n:r[1],c:r[2],r:r[3],p,paid,s:r[2]==null?'av':(r[3]>0?'cours':'ok')}});
const S={m:'all',l:'all',st:'all',nl:false,tab:'bilan'};
const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const F=()=>L.filter(x=>(S.m==='all'||x.m===S.m)&&(S.l==='all'||x.i==S.l)&&(S.st==='all'||x.s===S.st)&&!(S.nl&&x.m==='fon'));
const dt=d=>d?d.split('-').reverse().join('/'):'Date non renseignée';
const empty='<div class="card rise"><div class="t">Aucune ligne pour ce filtre.</div><p class="note">Élargissez la catégorie ou le statut.</p></div>';
const card=(x,i)=>`<article class="card rise" style="--i:${Math.min(i,8)}"><div class="lh"><div class="t">${x.n}</div><span class="badge b-${x.s}">${ST[x.s]}</span></div>
<div class="nums"><span>Payé <b>${fm(x.paid)}</b></span>${x.c!=null?`<span>Contrat <b>${fm(x.c)}</b></span>`:''}${x.r?`<span>Solde acquis <b>${fm(x.r)}</b></span>`:''}</div>
${x.c!=null?`<div class="mb"><span style="--c:var(--gold)" data-w="${Math.min(100,x.paid/x.c*100)}%"></span></div>`:`<div class="mb hat"></div><p class="note">Prix total non encore fixé — seules les avances versées sont affichées.</p>`}
<details><summary>${x.p.length} paiement${x.p.length>1?'s':''}</summary>${x.p.map(p=>`<div class="pr"><span>${dt(p.d)}</span><b>${fm(p.a)}</b></div>`).join('')}</details></article>`;
const gh=(c,t,b,i)=>`<h2 class="gh rise" style="--i:${Math.min(i,8)};--c:${c}"><i></i>${t}<b>${b}</b></h2>`;
const V={};
V.bilan=f=>{
  if(!f.length)return empty;
  const paid=sum(f,'paid'),come=sum(f,'r'),tot=paid+come,pc=tot?paid/tot*100:0,by={};
  f.forEach(x=>by[x.m]=(by[x.m]||0)+x.paid);
  const cm={};f.forEach(x=>cm[x.m]=(cm[x.m]||0)+x.r);
  const ks=Object.keys(by).filter(k=>by[k]>0).sort((a,b)=>by[b]-by[a]);let a=0;
  const g=ks.map(k=>{const s=a;a+=by[k]/paid*100;return`${M[k][1]} ${s}% ${a}%`}).join(',');
  const mx=by[ks[0]]||1;
  return`<section class="card rise" style="--i:0"><div class="k">Déjà payé</div><div class="big"><span data-n="${paid}">0</span><small>MAD</small></div>
<div class="bar"><span class="paid" data-w="${pc}%"></span><span class="come" data-w="${100-pc}%"></span></div>
<div class="stats"><div><div class="k">Acquis à venir</div><b data-n="${come}">0</b></div><div><div class="k">Total engagé ferme</div><b data-n="${tot}">0</b></div></div>
<p class="note">Barre pleine = payé · hachurée = solde contractuel acquis, dû à l’avancement. ${pc.toFixed(0)} % de l’engagé ferme est déjà réglé.</p></section>
<section class="card rise" style="--i:1"><div class="k">Où est passé l’argent</div><div class="donutrow" style="margin-top:14px"><div class="donut" style="background:${g?`conic-gradient(${g})`:'var(--line)'}"><span>Payé<br>par poste</span></div>
<div>${ks.map(k=>`<button class="m" onclick="pick('${k}')"><div class="h"><span class="t">${M[k][0]}</span><span class="a">${fm(by[k])}</span></div><div class="mb"><span style="--c:${M[k][1]}" data-w="${by[k]/mx*100}%"></span></div>${cm[k]?`<div class="sm">+ ${fm(cm[k])} acquis à venir</div>`:''}</button>`).join('')}</div></div>
<p class="note">Touchez un poste pour voir le détail ligne par ligne.</p></section>
<p class="note rise" style="--i:2">Seuls les paiements effectués et les soldes contractuels acquis figurent ici — aucune estimation, aucune projection.</p>`};
V.detail=f=>{
  if(!f.length)return empty;let i=0,h='';
  for(const k in M){const a=f.filter(x=>x.m===k);if(!a.length)continue;h+=gh(M[k][1],M[k][0],fm(sum(a,'paid')),i++)+a.map(x=>card(x,i++)).join('')}
  return h};
V.chrono=f=>{
  const ev=[];f.forEach(x=>x.p.forEach(p=>ev.push({d:p.d,a:p.a,x})));
  if(!ev.length)return empty;
  const g={};ev.forEach(e=>{const k=e.d?e.d.slice(0,7):'0';(g[k]=g[k]||[]).push(e)});
  const ks=Object.keys(g).sort().reverse(),dated=ks.filter(k=>k!=='0').reverse(),tt=k=>sum(g[k],'a'),mx=Math.max(...dated.map(tt),1);
  let h=`<section class="card rise" style="--i:0"><div class="k">Rythme des paiements</div><div class="cb">${dated.map(k=>`<div><span>${fm(tt(k)/1000)}k</span><i data-h="${Math.max(4,tt(k)/mx*100)}%"></i><span>${MOC[+k.slice(5)-1]}<br>${k.slice(2,4)}</span></div>`).join('')}</div><p class="note">Montants en milliers de MAD, par mois de paiement.</p></section>`;
  ks.forEach((k,j)=>{h+=gh('var(--gold)',k==='0'?'Date non renseignée':MOF[+k.slice(5)-1]+' '+k.slice(0,4),fm(tt(k)),j+1)+`<div class="card rise" style="--i:${Math.min(j+1,8)};padding-top:6px;padding-bottom:6px">`+g[k].sort((a,b)=>b.d<a.d?-1:1).map(e=>`<div class="ev" style="--c:${M[e.x.m][1]}"><i></i><div><div class="t">${e.x.n}</div><div class="sm">${dt(e.d)} · ${M[e.x.m][0]}</div></div><b>${fm(e.a)}</b></div>`).join('')+'</div>'});
  return h};
V.venir=f=>{
  const a=f.filter(x=>x.r>0).sort((x,y)=>y.r-x.r),av=f.filter(x=>x.s==='av');
  if(!a.length&&!av.length)return empty;let i=1;
  let h=`<section class="card rise" style="--i:0"><div class="k">Acquis à venir · contractuel</div><div class="big"><span data-n="${sum(a,'r')}">0</span><small>MAD</small></div><p class="note">Soldes dus sur contrats signés, réglés à l’avancement des travaux. Aucune estimation n’est incluse.</p></section>`;
  a.forEach(x=>h+=card(x,i++));
  if(av.length)h+=gh('var(--gold)','Pas encore chiffré',fm(sum(av,'paid'))+' avancés',i++)+`<p class="note">Prix total non fixé : ces lignes ne comptent que pour les avances déjà versées.</p>`+av.map(x=>card(x,i++)).join('');
  return h};
function pick(k){S.m=k;S.l='all';S.tab='detail';go();scrollTo({top:0,behavior:'smooth'})}
function rf(){
  const c=$('#fm');c.innerHTML='';
  const mk=(t,col,on,fn)=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',on);b.innerHTML=(col?`<i style="--c:${col}"></i>`:'')+t;b.onclick=fn;c.append(b)};
  mk('Tout',null,S.m==='all',()=>{S.m='all';S.l='all';go()});
